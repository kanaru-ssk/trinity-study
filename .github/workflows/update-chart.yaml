name: Update Chart

on:
  schedule:
    - cron: "0 0 1 * *" # 毎月1日の00:00に実行
  workflow_dispatch: # actionの手動実行を可能にする

permissions:
  contents: read

jobs:
  update-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: write # main への push に必要
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Update
        run: npm run update
        env:
          EXCHANGE_RATE_API_KEY: ${{ secrets.EXCHANGE_RATE_API_KEY }}
      - name: Check changes
        id: diff
        run: |
          if git diff --quiet -- src/data/chart.csv; then
            echo "チャートデータに変更はありません"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # GITHUB_TOKEN で作った PR や push では他のワークフローが起動しないため、
      # ここでテストしてから main に直接 push し、その SHA をデプロイする
      - name: Test
        if: ${{ steps.diff.outputs.changed == 'true' }}
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Commit and push
        id: push
        if: ${{ steps.diff.outputs.changed == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/chart.csv
          git commit -m "Automated update src/data/chart.csv"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update-chart
    # データに変更がなければデプロイしない
    if: ${{ needs.update-chart.outputs.sha != '' }}
    uses: ./.github/workflows/deploy.yaml
    with:
      ref: ${{ needs.update-chart.outputs.sha }}
    secrets: inherit # 再利用ワークフローへ CLOUDFLARE_API_TOKEN 等を渡す
